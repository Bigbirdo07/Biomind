# BioReason v0.2 SFT Training Configuration (BR-V02-SFT-001)
# Foundation: Merged BioReason v0.1 (BR-DPO-002-A) + Failure-Driven Curriculum v1

model:
  base_model: "Qwen/Qwen2.5-14B-Instruct"
  parent_adapter: "outputs/BR-DPO-002-A/checkpoint-100pct"
  torch_dtype: "bfloat16"
  use_flash_attention_2: true
  max_seq_length: 4096

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  name: "BioReasonTrain-v0.2-SFT-v0.1"
  train_file: "training_data/snapshots/BioReasonTrain-v0.2-SFT-v0.1/train.jsonl"
  val_file: "training_data/snapshots/BioReasonTrain-v0.2-SFT-v0.1/val.jsonl"
  replay_ratio: 0.25
  quality_tier_weights:
    TIER_A: 1.25
    TIER_B: 1.00

training:
  output_dir: "outputs/BR-V02-SFT-001"
  num_train_epochs: 2.0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.10
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  save_total_limit: 3
  seed: 42
  fp16: false
  bf16: true
