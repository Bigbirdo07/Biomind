# BioReason v0.2 Full DPO Training Configuration — Controlled Alternative (BR-V02-DPO-001-B)
# Foundation: Frozen BR-V02-SFT-001-A (Epoch 2.0 / Step 112) + Scaled Preference Dataset v0.2
# Single Variable Change: Lower learning rate (5e-6) and lower beta (0.05)

model:
  base_model: "Qwen/Qwen2.5-14B-Instruct"
  parent_adapter: "outputs/BR-V02-SFT-001-A/checkpoint-step-112-epoch-2.0"
  torch_dtype: "bfloat16"
  use_flash_attention_2: true
  max_prompt_length: 2048
  max_length: 4096

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

dataset:
  name: "BioReasonPreference-v0.2-DPO-v0.2"
  train_file: "training_data/preferences/BioReasonPreference-v0.2-DPO-v0.2/train.jsonl"
  val_file: "training_data/preferences/BioReasonPreference-v0.2-DPO-v0.2/val.jsonl"
  num_train_pairs: 215
  num_val_pairs: 35

dpo:
  beta: 0.05
  loss_type: "sigmoid"
  reference_free: false

training:
  output_dir: "outputs/BR-V02-DPO-001-B"
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.000005
  weight_decay: 0.01
  warmup_ratio: 0.10
  lr_scheduler_type: "cosine"
  logging_steps: 5
  save_strategy: "steps"
  save_steps: 7
  evaluation_strategy: "steps"
  eval_steps: 7
  save_total_limit: 4
  seed: 42
  fp16: false
  bf16: true
