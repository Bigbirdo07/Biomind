[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioreason"
version = "0.1.0"
description = "Biology-native scientific reasoning computational foundation and validation platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "BioReason Research Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
training = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "trl>=0.8.0",
]

[project.scripts]
bioreason = "bioreason.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
