model_name_or_path: "meta-llama/Meta-Llama-3-8B-Instruct"
output_dir: "outputs/bioreason_qlora_llama3_8b_p0"
train_dataset_path: "training_data/examples"
eval_benchmark_path: "benchmark/examples"

peft_method: "qlora"
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

precision: "bf16"
num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.0002
warmup_ratio: 0.05
weight_decay: 0.01
max_seq_length: 2048
seed: 42

save_strategy: "epoch"
save_total_limit: 3
logging_steps: 10
gradient_checkpointing: true
