experiment_name: "BR-SFT-001-A"
model_name_or_path: "Qwen/Qwen2.5-14B-Instruct"
output_dir: "outputs/BR-SFT-001-A"
train_dataset_path: "training_data/snapshots/bioreasontrain_sft_v0.1/train"
validation_split_path: "training_data/snapshots/bioreasontrain_sft_v0.1/val"
eval_benchmark_path: "benchmark/frozen/bioreasonbench_v0.1/dev"
snapshot_manifest_path: "training_data/snapshots/bioreasontrain_sft_v0.1/manifest.json"

selected_tiers:
  - "TIER_A"
  - "TIER_B"
  - "TIER_C"

tier_weights:
  TIER_A: 1.0
  TIER_B: 1.0
  TIER_C: 0.70
  TIER_D: 0.0

peft_method: "lora"
lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

precision: "bf16"
num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.0002
warmup_ratio: 0.05
weight_decay: 0.01
max_seq_length: 2048
seed: 42

save_strategy: "epoch"
save_total_limit: 3
logging_steps: 10
gradient_checkpointing: true
